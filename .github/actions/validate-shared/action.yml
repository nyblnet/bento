# validate, shared slice: The shared surface (scripts/, site tooling, i18n packs): checks that span every app. Runs LAST, after every shell is built.
#
# Part of the REQUIRED `validate` check. .github/workflows/ci.yml runs this
# action as steps INSIDE that one job, on the same runner, after the slices
# listed before it there — so what earlier slices installed and built is on
# disk here. A failing step here fails `validate` and blocks the merge.
#
# Add a new rig's step to the slice of the zone that owns the rig, at the
# end. Every `run:` needs `shell: bento-step {0}`: GitHub refuses a composite
# step with no shell, and bento-step (scripts/ci/) fails the step if a rig
# reports a skip CI does not allow (scripts/lib/ci-skips.mjs). A step here
# counts as registered for scripts/test-ci-registered.ts.

name: validate-shared
description: validate, shared slice (runs inside the required validate job)
runs:
  using: composite
  steps:
    - name: Language coverage
      # Core catalogs ship inside every saved file and cannot be corrected
      # without a release, so they must be complete. Packs are downloadable
      # and re-publishable on their own, so they get a floor and a report.
      shell: bento-step {0}
      run: node scripts/test-i18n-coverage.mjs

    - name: Language packs build and index cleanly
      # Emits every pack and builds the index payload WITHOUT signing (--dry
      # writes nothing and needs no key — signing stays local, see the header).
      # Catches a malformed pack catalog (missing label, duplicate language,
      # wrong app) here rather than mid-release.
      shell: bento-step {0}
      run: |
        node scripts/build-i18n.mjs --packs "$RUNNER_TEMP/packs"
        node scripts/sign-packs.mjs "$RUNNER_TEMP/packs" --dry

    - name: Shell sizes
      # TWO MECHANISMS, DELIBERATELY. This one and the advisory PR build-size
      # comment (.github/workflows/pr-build-size*.yml) answer different
      # questions, and deleting either as "duplicate measurement" loses a
      # class of regression:
      #
      #   this step  — ABSOLUTE and PERSISTENT. A shell with enforce:true has
      #     a ceiling and FAILS here; a shell with enforce:false prints its
      #     drift from a committed `reference` and never fails. It is the only
      #     thing that sees SLOW drift — forty merged commits at 300 B each,
      #     where every single PR looked fine on its own.
      #   the PR comment — RELATIVE and PER-PR. It reports this PR against its
      #     own base and never fails. It is the only thing that attributes a
      #     jump to the change that caused it, and it is blind to accumulated
      #     drift.
      #
      # Neither subsumes the other. Rationale in docs/DECISIONS.md.
      #
      # Placed after ALL THREE builds on purpose: the rig skips a shell that
      # is not built, so while this sat in the spaces section it silently
      # measured nothing for dash. bento/spaces has NO CEILING as of
      # 2026-08-24 (the maintainer's call; at 98.6% it had started deciding
      # which fixes were affordable) — the step still prints its size and
      # drift, it just no longer fails on it.
      shell: bento-step {0}
      run: node scripts/test-spaces-size.mjs

    - name: App registry rig
      # scripts/apps.mjs drives what a release builds, stages and signs. A
      # release SIGNS, and the key never reaches CI, so the pipeline itself
      # cannot be tested here — but the registry drifting from the tree can,
      # and a wrong appId is silent: shipped shells verify it against their
      # own configureApp() id and just stop updating.
      shell: bento-step {0}
      run: node scripts/test-release-apps.mjs

    - name: Publish deletion-gate rig
      # A publish assembles site/ for ONE app and mirrors it authoritatively.
      # Measured: a spaces-shaped site/ deleted 47 live files — the signed
      # shell, the manifest, all 22 packs — with every other gate green,
      # because those gates are `if (existsSync(...))` and skip when the
      # artifact is missing. Shipped files cannot recover from that.
      shell: bento-step {0}
      run: node scripts/test-publish-gate.mjs

    - name: publish account gate — the release account is checked before the site goes live
      # publish-site.mjs mirrored and pushed the site and THEN failed to
      # create the GitHub release, three releases running, because gh was
      # the work profile (a job/temp worktree). The gate runs before rsync;
      # this rig pins the rule and the order.
      shell: bento-step {0}
      run: node scripts/test-publish-account.ts

    - name: app payload fingerprint — a shell with no payload never passes the publish gates
      # publish-site's shell-consistency gate hashed the shell and every deck
      # to null when its matcher went stale, and null === null passed it while
      # it checked nothing. One shared helper; null is "cannot tell", never a match.
      shell: bento-step {0}
      run: node scripts/test-apphash.ts

    - name: every rig is actually run
      # A rig nobody runs is worse than no rig, and it fails flatteringly: the
      # file is there, the checks in it are good, git log shows it being
      # maintained, and anyone counting coverage counts it. It just never
      # executes, so nothing goes red and nothing says so. Five rigs landed in
      # one afternoon — write-back, print, frontier, a11y, appearance — each
      # written by a different agent told to write one, none of them knowing
      # where this list lives; all five passed on disk and none were here.
      # Also checks the reverse, since a step pointing at a deleted script
      # fails every push for a reason unrelated to the change that triggered
      # it, and prints the deliberate-exemption list on every run so it stays
      # something people look at rather than somewhere failures go to hide.
      shell: bento-step {0}
      run: node scripts/test-ci-registered.ts

    - name: Stylesheet brace balance
      # Every tracked stylesheet's braces balance. A merge seam that eats one
      # `}` leaves CSS that still builds — an unclosed `@media print {` makes
      # every later rule print-only, and the app ships unstyled while tsc, the
      # build and the shell gate all pass.
      shell: bento-step {0}
      run: node scripts/test-css-balance.ts

    - name: A rig that skips under CI fails its step
      # The positive control for bento-step (scripts/ci/): the exact skip lines
      # rigs printed on main are flagged and lines merely about skipping are
      # not; a step whose rig skips exits non-zero, end to end, including the
      # encrypted-title rig with jsdom hidden; only the allowlisted rigs may
      # skip, each with a reason, and each entry's rig still prints the line;
      # and every rig step in every CI file runs through the wrapper.
      shell: bento-step {0}
      run: node scripts/test-ci-skips.mjs

    - name: bento/connect directory (retired routes, address normal form, limits)
      # The real worker against in-memory Durable Objects: every route of the
      # first design (typed-code bind, the signed and typed-code deletions,
      # the lookup) answers 410 with the full header set and mails and stores
      # nothing; the object that held those bindings and its removal-code mail
      # are gone; the address normal form is the kernel's; per-IP limits hold;
      # no raw address or IP at rest.
      shell: bento-step {0}
      run: node scripts/test-directory.ts

    - name: bento/id directory passkey roster (rp id.bento.page, 72 h queue, mail, headers)
      # The real worker and Roster Durable Object on a hand clock, with real
      # browser registrations and the kernel's real assertions: the rp and the
      # one accepted origin, registration and assertion checks, setup tokens a
      # stranger cannot spend, one change at a time waiting 72 h on the
      # directory's clock, self-removal, the per-credential signature counter,
      # the log, roster mail that no stranger-fillable budget holds back, a
      # change that never waits without its waiting mail, spent challenges
      # that stay bounded, setup links that complete only on the sign-in host,
      # a setup budget that never leaves an address without a live link and
      # mails it at most ~4 links a day however often a stranger asks, pinned
      # link lives, a setup/start answer that is the same bytes in every
      # state, post-send writes that touch only the request's own change, a
      # mailer timeout, an alarm that sweeps spent challenges, mail
      # kinds that may never be held back, the sign-in host's routes (CORS to
      # it alone), and the headers every id.bento.page answer carries (an
      # unexpected failure included).
      shell: bento-step {0}
      run: node scripts/test-directory-roster.ts

    - name: bento/connect directory mutants
      # Each mutant reopens one path (a retired route served again; a loosened
      # roster, passkey, mail or header rule) in
      # a copy of the tree, and the directory rigs must fail a row. A mutant that no longer applies, or a rig that crashes
      # instead of counting, fails this step.
      shell: bento-step {0}
      run: node scripts/test-directory-mutants.ts

    - name: No frame is both scripted and same-origin
      # Fails on any frame a document can cause that has allow-same-origin AND
      # allow-scripts (or no sandbox at all), across every app's source and
      # every built shell with its deflated payloads inflated. Type's print
      # frame is allow-listed by name; two vendored Reveal frames are listed
      # with their unreachability premise asserted. Placed here, after all the
      # builds, because --require-built turns a missing shell into a failure
      # instead of a quiet pass; the mutants (unsafe pair, dropped sandbox,
      # computed value, extra frame) live in the rig.
      shell: bento-step {0}
      run: node scripts/test-frame-sandbox.mjs --require-built

    - name: Host routing files for bento.page
      # site-routing.mjs generates the _redirects that bento.page needs on
      # Workers static assets (html_handling "none"): every HTML file in the
      # published tree gets its extensionless / directory rules, or that URL
      # 404s. Also pins the template properties the move depends on: ACAO on
      # every path, no route or custom domain in wrangler.toml, .git and
      # .wrangler never uploaded.
      shell: bento-step {0}
      run: node scripts/test-site-routing.mjs

    - name: Site verifier catches every way a host can differ
      # verify-site.mjs compares a served bento.page against the published
      # tree and, optionally, a second host. Offline: two local servers over a
      # tree signed with a throwaway key. The identical host must pass with the
      # update path proven to have run; each mutant (.html redirect, a redirect
      # hop without a CORS grant, a missing grant, an added security header, a
      # changed byte, a cacheable 404, a tampered envelope) must fail.
      shell: bento-step {0}
      run: node scripts/test-verify-site.mjs

    - name: Hosting rules around the passkey relying party (id.bento.page)
      # check-id-hosting.mjs asserts what the rp's hosts may serve: no
      # /.well-known/webauthn on id.bento.page or the sign-in host, a CSP and
      # no framing on their HTML, nosniff and a WebAuthn-off
      # Permissions-Policy on id.bento.page, no COOP same-origin on the
      # sign-in host or home.bento.page, nothing else under id.bento.page, no
      # passkey association on bento.page. The rig drives its gatherer and
      # rules over a fake network: a conforming world passes, each of 21
      # mutants fails exactly its row. Then the repo rows for real: the
      # bento.page sources carry no association file. --live is for after a
      # deploy, by hand.
      shell: bento-step {0}
      run: |
        node scripts/test-check-id-hosting.mjs
        node scripts/check-id-hosting.mjs

    - name: Stage-0 measurement probes load and copy their results
      # server/stage0-probes: P1 (frame), P2 (install), P3 (keep), P5 (log
      # canary), P6 (slow MCP), in Chromium. Each page's Copy results line has
      # the shape the checklist asks for, and each probe keeps its promises:
      # P1 boots the built slides shell in an opaque cross-site frame (all
      # three modes, and offline), no request leaves the probe origins and the
      # ownerPriv canary never reaches window.bentoAgent; P2's worker answers
      # the share target offline; P3 never makes a key by itself; P5 logs only
      # its control line; P6 speaks MCP. Placed after the slides build, which
      # P1 boots; a missing shell fails, it does not pass quietly.
      shell: bento-step {0}
      run: node scripts/test-stage0-probes.mjs
