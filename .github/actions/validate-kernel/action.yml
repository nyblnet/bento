# validate, kernel slice: kernel/ and the sync relay: the shared machinery every app depends on (anim, field classes, restore, identity, UI primitives, storage, save, offline, the CRDT and the sync session).
#
# Part of the REQUIRED `validate` check. .github/workflows/ci.yml runs this
# action as steps INSIDE that one job, on the same runner, after the slices
# listed before it there — so what earlier slices installed and built is on
# disk here. A failing step here fails `validate` and blocks the merge.
#
# Add a new rig's step to the slice of the zone that owns the rig, at the
# end. Every `run:` needs `shell: bento-step {0}`: GitHub refuses a composite
# step with no shell, and bento-step (scripts/ci/) fails the step if a rig
# reports a skip CI does not allow (scripts/lib/ci-skips.mjs). A step here
# counts as registered for scripts/test-ci-registered.ts.

name: validate-kernel
description: validate, kernel slice (runs inside the required validate job)
runs:
  using: composite
  steps:
    - name: Which targets anim treats as elements
      # The element/plain-object split ran on HTMLElement||SVGElement, which
      # excludes MathML — formula symbols became plain-object tweens, with
      # opacity assigned as a JS property and no style ever written.
      shell: bento-step {0}
      run: node scripts/test-anim-elements.ts

    - name: Transforms are not silently ignored
      # A CSS transform does nothing to a non-replaced inline element: it is
      # accepted, style.transform reads back verbatim, and the box never
      # moves. An animation on one reports perfect health and paints nothing,
      # which is exactly how it survived eight rounds of debugging once.
      shell: bento-step {0}
      run: node scripts/test-anim-inline.ts

    - name: Typecheck kernel (standalone)
      # Apps also typecheck kernel transitively through their imports; this
      # catches kernel-only errors under the kernel's own flags. It ALSO
      # evaluates kernel/src/docfields.typecheck.ts (included via "src"): the
      # field-class table's type-level test, whose @ts-expect-error lines fail
      # this step if a guard is weakened (no default cell, 'per-field' only in
      # the mode row, every mode field has a rule).
      working-directory: slides
      shell: bento-step {0}
      run: node_modules/.bin/tsc -p ../kernel

    - name: Field-classification rig
      shell: bento-step {0}
      run: node scripts/test-field-class.ts

    - name: Whole-document restore rig (undo / version restore / crash recovery)
      # applyRestore decides per field from its class, with per-field overrides,
      # and the restore DIRECTION matters: a version restore ('back') keeps a
      # live field; crash recovery ('recover') reconciles a live history field
      # with the newer snapshot. Recover hooks (newestListWins for unsigned
      # lists) vs the default (signed-safe). On recover, a field absent from a
      # whole snapshot stays removed (deleted or cleared stays so) unless the
      # rules opt it out (keepLiveWhenAbsent); a projection keeps the live value.
      shell: bento-step {0}
      run: node scripts/test-restore.ts

    - name: identity agent contract
      # bento/id: how a document finds the host's identity agent. A valid
      # agent only, null otherwise (today's behaviour), never a throw, and
      # once found it cannot be swapped. Contract only: nothing calls it yet.
      shell: bento-step {0}
      run: node scripts/test-identity.ts

    - name: identity statements and conformance vectors
      # bento/id: every signed statement (dev., bind., att., tomb., del.,
      # cmp., cns.) and the address normal form. The reference must pass
      # every row of kernel/fixtures/identity-v1.json, which is the contract
      # each native host is held to, and must refuse every tampered statement.
      shell: bento-step {0}
      run: node scripts/test-statements.ts

    - name: identity recovery code and key blobs
      # bento/id: every host must derive the identical keys from the same
      # recovery code and passkey PRF output. Deterministic vectors in
      # kernel/fixtures/recovery-v1.json: Argon2id against RFC 9106, the
      # code's printed form and forgiving parse (all five extra check symbols),
      # every derivation, every blob re-sealed byte for byte, every refusal.
      shell: bento-step {0}
      run: node scripts/test-recovery.ts

    - name: identity seal — one "body is sealed" predicate
      # bento/id §E: every plaintext-to-disk guard asks isBodySealed(), not
      # "is there a password". The identity-sealed body is a genuine bento/enc
      # v1 envelope (kdf hkdf-kdoc) that frozen shells read as sealed; fresh
      # salt per save; the password path unchanged; the two refuse each other.
      shell: bento-step {0}
      run: node scripts/test-body-seal.ts

    - name: release history — append-only, anti-rollback, every block or unknown
      # bento/connect K4 (security §36): the signed release history only grows;
      # a host refuses a history that lacks an entry it holds or rolls its
      # newest version back; a file matches a release only if ONE entry matches
      # EVERY block. sign-history.mjs end to end with a throwaway test key.
      shell: bento-step {0}
      run: node scripts/test-release-history.ts

    - name: gate 1 — the shared verifier against the conformance corpus
      # bento/connect K5: kernel/src/gate1.ts, the one JavaScript gate-1
      # verifier, against home/fixtures/gate1/ read from disk as every host
      # reads it. The served path (one release matches every block, under the
      # grammar), the strict file:// path (both genuine saves pass, all 16
      # tampers refuse), anti-rollback, and the CSP a host serves under.
      shell: bento-step {0}
      run: node scripts/test-gate1.ts

    - name: Language pack verification rig
      # Packs come off the network, so the signature + hash-pin chain is the
      # only thing between a hostile channel and the strings in the UI.
      # Tampered pack, tampered index, unsigned index — each must be refused.
      shell: bento-step {0}
      run: node scripts/test-packs.ts

    - name: Tokenizer contract
      # The kernel's built-in highlighting tier. Renderers rebuild text from
      # the token stream, so losslessness is corruption-or-not; and multiline
      # tokens are declared, because a blockified token carrying \n collapses
      # a code block to one line with no error anywhere.
      shell: bento-step {0}
      run: node scripts/test-tokenize.ts

    - name: Shared panel primitive rig
      # kernel/src/ui/panel.ts is the second UI primitive (after the menu):
      # the resizable, collapsible side panel three apps hand-rolled and a
      # fourth stubbed. Every check guards a piece of invisible behaviour each
      # app learned alone — the no-animation-during-drag class, the RTL widen
      # direction, a collapsed panel refusing to drag, per-viewer persistence
      # clamped on restore, the drawer that boots shut below a phone width —
      # plus the theming guard (every colour chain reaches a token each of the
      # four apps defines and themes). Each is mutation-caught.
      shell: bento-step {0}
      run: node scripts/test-ui-panel.ts

    - name: Shared dialog primitive rig
      # kernel/src/ui/dialog.ts is the tier-3 consolidation: the modal all
      # four apps build their About dialog on. The checks guard behaviour that
      # lived in one app or none — focus captured on open and restored to the
      # opener on close, a capture-phase document Escape that does not fall
      # through to the editor behind it, backdrop dismissal that a click on the
      # card does not trigger, and a real focus trap (Tab wraps in the card) —
      # plus listener cleanup and the shared theming guard. Each is
      # mutation-caught; none is visible to a developer with a mouse.
      shell: bento-step {0}
      run: node scripts/test-ui-dialog.ts

    - name: Shared tooltip primitive rig
      # kernel/src/ui/tooltip.ts — built ahead of a consumer (no app has a
      # hover tooltip; all four use native title=), so the checks pin the
      # contract chosen, not a behaviour found: shows after a delay on
      # hover/focus, hides on leave/blur/Escape, wires aria-describedby, does
      # not flash on a pointer passing through, and — the one that matters —
      # renders in document.body as a fixed element so no scroll container
      # clips it (hard-won detail 10). Behaviours mutation-caught; themed
      # through the shared guard.
      shell: bento-step {0}
      run: node scripts/test-ui-tooltip.ts

    - name: Shared toggle primitive rig
      # kernel/src/ui/toggle.ts — built ahead of a consumer (the three
      # "toggle"-named classes across the apps are a native checkbox, a
      # disclosure block and a button group; no shared switch). The checks pin
      # the contract chosen: a real role="switch" with aria-checked, a click
      # toggles and fires onChange, set() updates state WITHOUT firing
      # onChange, and it is a <button> so the platform gives it keyboard
      # activation. Behaviours mutation-caught; themed through the shared guard
      # (whose alias-indirection fix — a token defined as var(--other) is
      # themed iff --other is — landed here so dash's --chrome-2: var(--hover)
      # resolves).
      shell: bento-step {0}
      run: node scripts/test-ui-toggle.ts

    - name: Shared menu primitive rig
      # kernel/src/ui/menu.ts replaces four hand-rolled dropdowns, and what
      # differed between them was all INVISIBLE: three of the four apps
      # publish no aria-expanded at all, five of slides' eight dropdowns never
      # dismissed on an outside press, no app closed a menu on Escape or let
      # an arrow key move through one, and two apps added a document listener
      # per dropdown and removed none. Each of those is a check here, because
      # every one of them is a regression a sighted developer with a mouse
      # would never notice.
      shell: bento-step {0}
      run: node scripts/test-ui-menu.ts

    - name: First-page preview rig
      # Every save writes a static render of page one for file-manager
      # thumbnails. Two decisions in that path fail silently: an encrypted
      # deck must never carry one, and author content must never reach the
      # file carrying a script tag.
      shell: bento-step {0}
      run: node scripts/test-preview.ts

    - name: Encrypted-title rig
      # An encrypted file must not announce its subject in plaintext: the
      # <title> and the suggested download filename both used to derive from
      # the document title. Pins that encrypted output gets a generic title
      # and a neutral filename (source gate, always on), with a whole-file
      # scan where a DOM is present.
      shell: bento-step {0}
      run: node scripts/test-enc-title.ts

    - name: Return-gate rig
      # The web demo always starts fresh, so someone who saved from
      # bento.page and came back saw a blank starter and read it as lost
      # work. The gate that fixes it can be worse than the silence it
      # replaces: firing over a real document, or offering a host that has no
      # release (telling an Android user to install a Chrome extension). This
      # pins both, and that the mobile rows degrade until those hosts ship.
      shell: bento-step {0}
      run: node scripts/test-return-gate.ts

    - name: Offline-mode rig
      # Offline mode promises "nothing leaves this computer" and was broken
      # five ways at once (GHSA-5c3x-xqp6-g94r): a manual update check, a
      # language-pack download, a deck's remote <video>, in-flight requests
      # that kept running, and a second tab's socket that kept syncing.
      #
      # It stayed hidden because it reads as correct: an agent asked to audit
      # it said "secure" from the docs AND from the code. So the rig does not
      # check the call sites — it enforces the POLICY that no file outside
      # kernel/src/net.ts may touch a network primitive at all, which is what
      # stops the NEXT call site being wrong, plus the chokepoint's own
      # behaviour (refusal, aborting what is already in flight, cross-tab).
      shell: bento-step {0}
      run: node scripts/test-offline.ts

    - name: Origin-trust rig
      # The release-manifest / sync / pack URL dev overrides live in
      # localStorage, which is shared across all file:// documents — so they
      # are honoured only from a real, isolated origin (sharedStorageOrigin).
      shell: bento-step {0}
      run: node scripts/test-origin-overrides.ts

    - name: Blob content-address rig
      # Encrypted assets are fetched by content address from a relay the
      # threat model treats as untrusted. Nothing verified that what came
      # back matched what was asked for, and the substitution was cached to
      # disk, so one poisoned response persisted.
      shell: bento-step {0}
      run: node scripts/test-blobs.ts

    - name: Save-intent rig
      # A host polyfilling showSaveFilePicker sees only the options bag, and
      # must tell "overwrite the open document" from "make a second file" from
      # that alone. It could not, and a browser extension overwrote a deck.
      # `id` is the signal; if the three purposes ever collapse to one value
      # every host silently loses the distinction.
      shell: bento-step {0}
      run: node scripts/test-savepurpose.ts

    - name: Remember-the-file-handle rig
      # A deck in ~/Documents or ~/Downloads can never be covered by a
      # directory grant (Chrome's blocklist), so it re-ran the save picker on
      # every reopen. The FILE handle is remembered (IndexedDB by docId) and
      # reconnected with a permission prompt inside the save gesture. Guards:
      # name-match, denied/NotFound -> picker + drop, only a real handle (never
      # a host polyfill), reconnect BEFORE serialize so activation stays fresh.
      shell: bento-step {0}
      run: node scripts/test-file-handle.ts

    - name: DocStore (per-document storage under the extension)
      # Under bento/home, the crash-recovery copy and the member key's private
      # half live in the extension's per-document store; localStorage keeps
      # only the public key its readers need. No host, or a host that refuses
      # or never answers: the old storage, unchanged.
      shell: bento-step {0}
      run: node scripts/test-docstore.ts

    - name: Guarded storage rig
      # localStorage's absence is hostile: reading the PROPERTY throws, so
      # `if (localStorage)` is itself the crash and one bare read at module
      # scope takes the whole file down before it paints. Measured in a
      # sandboxed iframe. The rig simulates each failure mode and pins the
      # regression: importing a module that reads storage on load must not
      # throw when storage does.
      shell: bento-step {0}
      run: node scripts/test-storage.ts

    - name: Save queue rig
      # kernel/src/savequeue.ts serializes writes against one file handle and
      # acknowledges each by revision, so an edit made WHILE an async write is in
      # flight is never marked saved and lost (the setDirty-after-write race
      # every app had). The rig pins serialization, the detached snapshot,
      # isCurrent() going stale on any later edit or same-id replacement, the
      # document-swap discard, and that a failed write never poisons the queue.
      shell: bento-step {0}
      run: node scripts/test-savequeue.ts

    - name: Autosave per-app database rig
      # Every app shared one IndexedDB database AND one DB_VERSION, so spaces
      # has been writing into slides' store, and a version bump by any new app
      # would make every SHIPPED shell of every other app throw VersionError
      # and lose autosave. Renaming without carrying the data over would empty
      # a visible feature, so the migration is tested in both directions.
      shell: bento-step {0}
      run: |
        slides/node_modules/.bin/esbuild scripts/test-autosave.ts --bundle --platform=node --format=esm \
          --alias:fake-indexeddb/auto=./slides/node_modules/fake-indexeddb/auto/index.js \
          --outfile="$RUNNER_TEMP/test-autosave.mjs"
        BENTO_TEST_APP=bento-slides node "$RUNNER_TEMP/test-autosave.mjs"
        BENTO_TEST_APP=bento-spaces node "$RUNNER_TEMP/test-autosave.mjs"

    - name: The plaintext store refuses while sealed (bento/connect backstop)
      # kernel/src/autosave.ts: while the body is sealed (password or identity
      # seal), putRecovery/addVersion refuse and getRecovery/listVersions offer
      # nothing, so an app missing one of its own guards still can't write or
      # offer plaintext. The purge (clearRecovery/clearVersions) still works
      # while sealed, for that document only.
      shell: bento-step {0}
      run: |
        slides/node_modules/.bin/esbuild scripts/test-store-backstop.ts --bundle --platform=node --format=esm \
          --alias:fake-indexeddb/auto=./slides/node_modules/fake-indexeddb/auto/index.js \
          --outfile="$RUNNER_TEMP/test-store-backstop.mjs"
        node "$RUNNER_TEMP/test-store-backstop.mjs"

    - name: zip decompression-bomb cap
      # readZip caps each entry's inflated output at min(declared size, a hard
      # ceiling), aborting the stream the instant it overflows — a crafted
      # archive that under-declares its size can no longer exhaust memory before
      # the size check runs. Every check is mutation-proven against a neutered cap.
      shell: bento-step {0}
      run: node scripts/test-zip-bomb.ts

    - name: relay protocol — one wire format, two clients
      # dash's online.ts is a PORT of the transport slides uses (now moving
      # into kernel/). The two files are separate text that nobody diffs, and
      # ONE DEPLOYED WORKER verifies both: it pins the room id to a key and
      # walks an owner→invite→member signature chain. If one client's idea of
      # `inv.${pub}.${role}.${exp}` drifts, the symptom is not a red test — it
      # is one app's users silently unable to join the other's rooms, on a
      # relay that cannot be rolled back independently of the shells already
      # in people's files. This diffs only what goes on the wire.
      shell: bento-step {0}
      run: node scripts/test-relay-protocol.ts

    - name: relay broadcast rig
      # A show is a special case of collaboration: an audience member holds
      # an owner-signed `audience` invite and a per-show key, and the relay
      # routes by stream. What breaks silently if this regresses: an audience
      # socket admitted on the room token (it holds the show key, not the
      # room key, so the compare must be skipped for the role and only the
      # role); an audience socket that can send anything (the invite is on the
      # same chain as a writer's, so the check is by role); an aud frame that
      # reaches the room stream or the room's op log (show-key ciphertext
      # persisted forever, replayed to every future collaborator as noise); a
      # late joiner served the room's op log; show state kept in memory,
      # which hibernation evicts mid-show; and the presenter-loss grace timer
      # firing the DO's single alarm as the 30-day room WIPE. Each is a
      # mutation this rig turns red on.
      shell: bento-step {0}
      run: node scripts/test-relay-broadcast.ts

    - name: relay authorization rig
      # Drives the real Room durable object with fake sockets and storage.
      # What it guards: the relay stamps a fanned-out frame with exactly what
      # it verified and never with what it did not; a socket that merely
      # hash-matches the room's public key is challenged and handed no blob
      # write ticket, cannot latch the room, and cannot answer with a forged,
      # replayed or cross-room proof; revocation re-mints the ticket to
      # proven sockets only; and a snapshot claiming a seq the room has not
      # reached is refused rather than allowed to prune the op log. Every
      # one of these is silent when it regresses — the relay keeps working
      # and simply trusts more than it should.
      shell: bento-step {0}
      run: node scripts/test-relay-auth.ts

    - name: client vouch rig — the other half of read-only
      # Drives a REAL OnlineTransport (kernel's and dash's twin) through a
      # fake socket in a signed room. Every copy holds the room key, so a
      # reader can encrypt an op batch and the blind relay fans it out
      # unstamped; the client's `vouched()` is the only thing between that
      # frame and every live editor applying it. With `vouched` mutated to
      # `return true`, every other rig in the tree stayed green — security
      # found that by mutation, and this rig is the answer: unstamped ops and
      # snapshots refused, stamped ones applied, presence unaffected, legacy
      # r-rooms permissive. Bundled because the kernel transport uses
      # parameter properties, which node's strip-only loader rejects.
      shell: bento-step {0}
      run: |
        slides/node_modules/.bin/esbuild scripts/test-sync-vouch.ts --bundle --platform=node --format=esm \
          --outfile="$RUNNER_TEMP/test-sync-vouch.mjs"
        node "$RUNNER_TEMP/test-sync-vouch.mjs"

    - name: session broadcast surface rig
      # startShow/endShow, the verb channel, and the audience's reception.
      # What breaks silently if it regresses: the audsnap under the show key
      # is the LIVE sync state instead of a fresh adopt of the projected doc,
      # which leaks `stash` (deleted slides' notes) and the whole per-keystroke
      # text history past the projection; or a local op reaches the audience
      # without the app's projection applied. Both are mutation-caught here.
      shell: bento-step {0}
      run: node scripts/test-sync-show.ts

    - name: CRDT property-removal rig
      # Removing a property travels as a `set` op with `v` ABSENT, and the
      # receiving replica threw on it: JSON.stringify(undefined) is undefined,
      # and a debug line sliced it. Live in shipped files. The convergence rig
      # missed it through 300 seeds because its generator assigns properties
      # and never removes one — a property-based rig only explores the
      # mutations it was taught.
      shell: bento-step {0}
      run: node scripts/test-crdt-delprop.ts

    - name: CRDT convergence rig
      # 40 seeds locally; deeper on CI where the seconds are free.
      shell: bento-step {0}
      run: SEEDS=300 node scripts/test-sync.ts

    - name: CRDT equivalence rig (baseline vs candidate, byte for byte)
      # Convergence is the weaker property: an engine that converges with
      # ITSELF while minting different bytes than the shipped engine passes
      # the step above and silently splits every bento/slides file in the
      # field. This step asserts byte-identity instead.
      #
      # The baseline is a FROZEN copy of the engine as shipped
      # (scripts/lib/sync-baseline-frozen.ts), so this run is live from here
      # on: it compares the working engine against the bytes every file in
      # the field was written by. REQUIRE_LIVE=1 fails the build if the
      # candidate is ever repointed at something that resolves back to the
      # baseline — the quiet way a gate stops gating.
      shell: bento-step {0}
      run: REQUIRE_LIVE=1 SEEDS=200 STEPS=60 ACTORS=4 node scripts/test-sync-equiv.ts

    - name: CRDT document-shape seam
      # The equivalence rig proves a NEGATIVE — that the parameterized engine
      # still mints the bytes shipped files were written with — and a
      # parameterization that quietly did nothing would pass it. This proves
      # the positive: a second shape (pages→blocks) produces an engine that
      # actually works, keys nodes on the composite pageId+blockId, and
      # restores as itself. Also pins the constructor contract: the shape has
      # no default, because a default is how a spaces call site silently ends
      # up holding slides' shape.
      shell: bento-step {0}
      run: node scripts/test-sync-shape.ts

    - name: bento/spaces under the shared engine
      # Convergence for the pages/blocks binding, AND a report on whether
      # what the replicas converge on is a legal bento/spaces document.
      # Those are different questions: page.blocks is flat and in pre-order,
      # while the engine merges `parent` as an ordinary register and order as
      # a position key — two independent domains describing one tree. The
      # format half is REPORTED, not asserted, because the fix is a decision
      # nobody has taken yet; STRICT=1 turns it into a gate the day it is.
      shell: bento-step {0}
      run: SEEDS=250 STEPS=80 ACTORS=4 node scripts/test-sync-spaces.ts

    - name: collaborative text on a parent node
      # The token RGA — what lets two people type in one paragraph without
      # destroying each other's work — was reachable only on CHILD nodes,
      # because both shipped apps put their text there. bento/type does not:
      # a block IS the paragraph. Bound naively it would get a
      # last-writer-wins register for prose and lose an edit SILENTLY, with a
      # document that stays valid and converges. Every other sync rig stayed
      # green through that bug, so this one carries a negative control: the
      # same scenario with the RGA off MUST lose an edit.
      shell: bento-step {0}
      run: node scripts/test-sync-parent-text.ts

    - name: a flat document shape
      # bento/type is one level deep — `body` holds blocks and nothing sits
      # beneath them — so `children` is null and there is no element layer.
      # Binds type's real shape and checks both halves: text still merges
      # token-by-token, and the document keeps its shape. The second matters
      # because an engine that quietly wrote `elements: []` onto every block
      # would converge perfectly while corrupting the format.
      shell: bento-step {0}
      run: node scripts/test-sync-flat.ts

    - name: bento/type under the shared engine
      # Convergence for the flat ('body', null, 'text') binding, AND a report
      # on whether what the replicas converge on is a legal bento/type
      # document. Those are different questions: `text` merges token by token
      # through the RGA while `marks` and `notes` — character offsets INTO
      # that text — merge as ordinary registers, so two legal concurrent
      # edits can converge on offsets that no longer describe the text they
      # index. Reported, not asserted, exactly as the spaces tree question
      # is: it is a format decision nobody has taken. STRICT=1 makes it a
      # gate the day one is.
      shell: bento-step {0}
      run: SEEDS=250 STEPS=80 ACTORS=4 node scripts/test-sync-type.ts

    - name: the sync session layer
      # The session — differ hook, shadow, presence, catch-up, the empty
      # document repair — had NO tests before it was moved into the kernel
      # and parameterized for three apps. This was written against the
      # implementation as it shipped and run unchanged after the move, which
      # is the only thing that makes "behaviour is identical" a claim rather
      # than a hope. It drives the REAL session over the REAL store through a
      # REAL BroadcastChannel; two sessions in one process are two tabs.
      # The last four sections bind bento/type to the same kernel session —
      # flat document, text on the parent, a store with one listener and no
      # dirty flag — so a surviving slides assumption shows up there.
      shell: bento-step {0}
      run: node --no-warnings scripts/test-sync-session.ts

    - name: the blob cache holds ciphertext only
      # Live-session media is cached in IndexedDB, which every page on the
      # same origin can read (on file://, every local file). The cache must
      # hold the relay's ciphertext, never the decrypted bytes: every write
      # path, a hit, a tampered entry, the version-1 purge, the shipped v1
      # opener against an upgraded database, and a blocked upgrade.
      shell: bento-step {0}
      run: node --no-warnings scripts/test-blobcache.ts

    - name: Room snapshot carries no capability fields
      # Every snapshot path (relay upload, fork broadcast, re-snap, flush-time
      # fork snap) builds from one helper that strips the never-synced fields.
      shell: bento-step {0}
      run: node --no-warnings scripts/test-sync-snapshot-collab.ts

    - name: Remote ops and snapshots can't rewrite identity, capability or modes
      # The never-synced set is also the receive filter (applySet and
      # mergeSnapshot), and no prototype-shaped name reaches any object.
      shell: bento-step {0}
      run: node --no-warnings scripts/test-sync-inbound-docfields.ts

    - name: Doc-level sync allowlist (field-class map)
      # The other half of the never-synced set: when an app binds a class map,
      # a peer emits only content-class doc keys and ignores non-content ones
      # inbound, whatever the sender claims; an unknown key (a newer build's
      # field) is applied but never re-emitted. With no map it is byte-for-byte
      # the shipped denylist. skipDoc is the floor under both.
      shell: bento-step {0}
      run: node scripts/test-sync-allowlist.ts

    - name: Sync override for a history-class key (shape().syncHistory)
      # A field's copy class and its sync decision can diverge: type classes
      # `comments` history (dropped from reader/export copies) but comments
      # must still flow live. syncHistory names such a key — emitted and
      # accepted though non-content, with its 1.2.7 wire shape unchanged so a
      # bound build stays mixed-version-compatible with an unbound one.
      # Restricted to history-class keys at runtime (shape throws) and at
      # compile time (historySyncKeys); skipDoc is still the floor.
      shell: bento-step {0}
      run: node scripts/test-sync-history-override.ts
