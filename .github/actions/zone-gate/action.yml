# Should this zone's heavy jobs run on this event?
#
# Used by the zone workflows whose jobs are slow or need special runners
# (desktop, iOS, Android, share, the home browser engines). None of them is the
# required check: `validate` (ci.yml) runs every zone's slice on every PR.
#
#   - a push to main ............ yes, always: every merge runs everything
#   - a PR labelled `full-ci` .... yes
#   - a PR that changes one of this zone's OWN files (the `own` pattern) ... yes
#   - any other PR ............... no: the jobs are skipped, and say so
#
# A job that depends on this one carries
#   needs: <zone>-gate
#   if: needs.<zone>-gate.outputs.run == 'true'
# and scripts/test-ci-registered.ts holds every job in a gated workflow to that.
name: zone gate
description: Decide whether a zone's heavy jobs run for this event
inputs:
  own:
    description: An extended regular expression, matched against each changed path
    required: true
  token:
    description: A token that can list the pull request's files
    default: ${{ github.token }}
outputs:
  run:
    description: "'true' or 'false'"
    value: ${{ steps.decide.outputs.run }}
runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        OWN: ${{ inputs.own }}
      run: |
        set -euo pipefail
        decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "zone gate: run=$1 ($2)"; }
        if [ "$EVENT" != "pull_request" ]; then decide true "event $EVENT"; exit 0; fi
        if [ "$LABELLED" = "true" ]; then decide true "the PR carries the full-ci label"; exit 0; fi
        # The list could not be read: run, never skip on a guess.
        if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
          decide true "the changed files could not be listed"; exit 0
        fi
        hit="$(printf '%s\n' "$files" | grep -E -m1 -- "$OWN" || true)"
        if [ -n "$hit" ]; then decide true "the PR changes $hit"; else decide false "no changed path matches this zone, and no full-ci label"; fi
