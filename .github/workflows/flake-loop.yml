# SCRATCH, never to merge: loops the engine rigs with no retry to measure
# their flake rates. Lives only on a throwaway branch.
name: flake loop
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        leg: [firefox]
        shard: [1, 2, 3, 4]
    env:
      LP_NATIVE_VECTOR_WIDTH: '128'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix slides
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: juggler repro (no bento code)
        run: |
          V=plain N=100 node .github/flake-loop/juggler-repro.mjs || true
          V=sw N=100 node .github/flake-loop/juggler-repro.mjs || true
          V=csp N=100 node .github/flake-loop/juggler-repro.mjs || true
      - name: loop
        run: |
          engine=${{ matrix.leg }}; engine=${engine%-persistent}
          persistent=0; case "${{ matrix.leg }}" in *-persistent) persistent=1;; esac
          dbg=pw:browser; [ "$engine" = firefox ] && dbg=pw:browser,pw:protocol
          KEEP_ALL=1 BENTO_HW3_PERSISTENT=$persistent BENTO_BROWSER=$engine DEBUG=$dbg .github/flake-loop/loop.sh 5 "${{ matrix.leg }}-${{ matrix.shard }}" node scripts/test-home-web-offline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.leg }}-${{ matrix.shard }}
          path: failures/
          if-no-files-found: ignore
