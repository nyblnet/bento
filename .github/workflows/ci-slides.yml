# CI, slides: this zone's own jobs — validate, never release (see ci.yml's header).
#
# These jobs are NOT the required check. Only `validate` (ci.yml) gates a
# merge; a job here reports beside it, exactly as it did when it lived in
# ci.yml. Keep each job's id unchanged — the id IS the check name.
#
# Each job checks out and builds what it needs for itself. Add this zone's
# new jobs here, at the end; never in ci.yml.

name: CI (slides)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # The same rule as ci.yml, whose comment explains it: PR runs collapse onto
  # the tip, every commit on main keeps its own run.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Every step fails if a rig in it reports a skip CI does not allow
    # (scripts/lib/ci-skips.mjs). No job here sets a working-directory, which
    # this relative path relies on.
    shell: bash scripts/ci/bento-step {0}

jobs:
  # Its own job: ten spellings across every surface is several minutes, and it
  # runs in parallel with the main browser job rather than against its timeout.
  slides-egress-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the packaged document
        run: |
          npm ci --prefix slides
          npm run build:single --prefix slides
      - name: No document string makes slides fetch anything in Chromium
        # Every string field of every element kind, the slide and the theme, in
        # ten url() spellings (escaped ones included), plus a morph into payload
        # paint, the preview's lower tiers and a peer's presence colour: on every
        # surface (canvas, panels, present, speaker, print, the saved file with
        # JS off) the payload origin is never requested; a raw url() is.
        run: node scripts/test-slides-css-egress-browser.mjs
      - name: The shared svg sanitizer's policy options only tighten
        # kernel/src/svgsafe.ts, lifted from slides' renderer: slides' lists are
        # the default, and every option an app adds (type's embed pictures use
        # all of them) removes what the default keeps and never keeps more.
        run: node scripts/test-svgsafe-policy-browser.mjs

  slides-font-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        # WebKit too, for the gate-1 oracle: a Chromium-only oracle missed a bypass
        # that a WebKit oracle found.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone documents
        run: |
          npm ci --prefix slides
          npm run build:single --prefix slides
          npm run build:sealtest --prefix slides
      - name: The sealed TEST document in Chromium
        # bento/id §E (security §31): the shared helper boots the build:sealtest
        # shell with the identity seal set before the app's own boot, proves it
        # took, and the saved file carries an identity-sealed envelope, a
        # neutral <title> and filename, no preview, and no plaintext; the
        # unsealed control shows the same checks can see a leak.
        run: node scripts/test-sealed-boot.mjs
      - name: Release pins in Chromium
        # bento/connect K4 (security §18/§36): this build's pins come from its
        # own bytes, a real file its ⌘S saved, and it boots under them while its
        # UI is driven, with only the loader's two designed refusals. What
        # release.mjs requires before it signs, checked on every PR.
        run: node scripts/derive-pins.mjs slides/dist-single/Bento_Slides.bento.html
      - name: The pinned-CSP boot check refuses doctored copies in Chromium
        # K4: the boot check excuses only the loader's two fallbacks, from a
        # line AND column inside its own text. An injected <script> in <head>
        # or on the loader's own lines is reported, and the rig checks WHICH
        # refusal was excused, not just how many. A wrong loader pin never boots.
        run: node scripts/test-csp-boot-browser.mjs
      - name: Gate 1 against a browser oracle in Chromium
        # K5 (security): a differential fuzz can't see a bug the reference and a
        # port SHARE, and both the "/" attribute separator and the length-changing
        # case fold were shared. So genuine files are mutated the ways scanners
        # split, and every mutant gate1 calls GENUINE is loaded with NO CSP, in
        # Chromium AND WebKit: exactly the loader and the remover may run. A fixed seed, plus a short
        # random run whose seed is printed for replay. Any failure is written to
        # home/fixtures/gate1/oracle-failures/ as a corpus row.
        run: node scripts/test-gate1-oracle.mjs
      - name: A sealed slides deck keeps its content out of IndexedDB in Chromium
        # The autosave and ⌘S checkpoints write no recovery copy or version for
        # a deck sealed by identity; the password menu stays keyed to the
        # password; the unsealed control shows the scan sees a leak.
        run: node scripts/test-slides-sealed-guards-browser.mjs
      - name: A sealed deck's title stays out of window titles in Chromium
        # At the gate, after unlock, after an edit, and in the speaker window;
        # adding a password neutralises the tab before the save, and removing
        # it brings the title back (an unencrypted deck is the control); a deck
        # sealed by identity, on the build:sealtest shell above, too.
        run: node scripts/test-slides-sealed-title-browser.mjs
      - name: Exercise the packaged documents in Chromium
        # Real UI and serialization, offline; delayed mock writes expose save races.
        run: |
          node scripts/test-slides-font-lifecycle-browser.mjs
      - name: An embedded font keeps its weights in Chromium
        # #850: "Embed font file…" writes the range a variable TTF/WOFF states,
        # the range a variable WOFF2 renders (ours and Instrument Sans), a
        # static face's weight and italic; Bold then draws the font's own 700,
        # 1.55x wider than 400, where the old `normal` drew faux bold at 1x.
        run: node scripts/test-slides-font-weight-browser.mjs
      - name: Write chrome follows the copy's role in Chromium
        # canWriteDeck is an allowlist that fails closed: an audience, reader or
        # unknown-role copy arriving in a running editor (dropped, loadDoc) gets
        # no write actions and is locked; owner and writer copies keep theirs.
        run: node scripts/test-slides-audience-gate-browser.mjs
      - name: PowerPoint converter links in Chromium
        # Save as → Import PowerPoint… (/convert?from=pptx) and Export for
        # PowerPoint… (/convert), in that order after Replace from JSON…, each
        # opens only its URL in a new tab with no opener, and says it needs
        # the network.
        run: node scripts/test-slides-import-link-browser.mjs
      - name: The unsupported-browser notice names the app in Chromium
        # Each app's shell, built with the flags its own build:single passes,
        # says what it is ("a bento/slides presentation", …) — it said "a
        # bento/dash spreadsheet" in every app.
        run: node scripts/test-shell-unsupported-notice-browser.mjs
      - name: Under-specified documents boot in Chromium
        # parseDoc fills required fields only where absent and drops elements
        # that cannot render; unknown keys and element types survive (additivity).
        run: node scripts/test-slides-minimal-doc-browser.mjs
      - name: A table with no style opens in Chromium
        # A full document whose table omits `style` (absent, null, a string)
        # loads by file, loadDoc and Replace from JSON, gets the theme's table
        # style, and selecting it opens the table panel without a page error.
        run: node scripts/test-slides-table-nostyle-browser.mjs
      - name: Top bar in Chromium
        # 30px row and 44px phone targets, the wordmark as a named button, Save
        # primary in both themes, and N language rebuilds leaving one set of
        # window/document listeners and bar observers.
        run: node scripts/test-slides-topbar-browser.mjs
      - name: One field look in Chromium
        # Every chrome text field, select and textarea (each element kind's
        # panel, About, the save-as dialogs, Share, comments) has the shared
        # field look and amber focus ring in both themes, never the UA's dress.
        run: node scripts/test-slides-fields-browser.mjs
      - name: A password-protected deck opens in Chromium
        # One password gate and no loader failure card (1.2.0–1.2.8 showed
        # three gates under "every loader path was refused"); wrong then right
        # password; the same with only the blob import allowed; the ⌘S re-save
        # and the self-update re-splice open again.
        run: node scripts/test-slides-encrypted-open-browser.mjs
      - name: The saved preview keeps pictures that fit in Chromium
        # An image used twice is held once (hoisted), a 62 KB image that fits
        # keeps tier 1, and a page whose assets exceed the budget takes the fast
        # path straight to tinted boxes.
        run: node scripts/test-slides-preview-tiers-browser.mjs
      - name: Saving never costs an edit its recovery copy in Chromium
        # A dismissed save leaves the edit's pending auto-save running (so its
        # recovery copy is written); a save that succeeds records a recovery
        # baseline and a version from the idle-time checkpoint.
        run: node scripts/test-slides-save-recovery-browser.mjs
      - name: The loader reads what the app published in Chromium
        # Toy shells from the real postbuild: an app that is running, locked at
        # a gate, or refused (and threw) runs ONCE and gets no loader card; only
        # an app that published nothing does. Every path, blob only, import.meta.
        run: node scripts/test-shell-loader-published-browser.mjs
      - name: Top bar holds still in Chromium
        # #546: a real auto-save "Saved" flash and a file-chip change (rename to
        # the file's name, then undo) leave Undo/Redo exactly where they were,
        # on the desktop and the folded phone bar.
        run: node scripts/test-slides-topbar-stable-browser.mjs
      - name: Chrome rulings in Chromium
        # D2 menu descriptions (readable both themes, ARIA-wired, scroll on a
        # short window), D4 dialog titles, D8 help shortcuts, the compact Save
        # caret, phone menu rows, the designed focus ring, dark menu shadow.
        run: node scripts/test-slides-chrome-rulings-browser.mjs
      - name: Code in a text box in Chromium
        # Real typing: a ``` fence becomes a Code element (in place, or split
        # out of the text around it), select + ` wraps lines in <code>, pasted
        # fences convert, and an unclosed fence stays text.
        run: node scripts/test-slides-code-fence-browser.mjs
      - name: Copy several slides in Chromium
        # Two selected thumbnails → ⌘C copies both, in order; a Shift-click
        # range across a parent copies parents only, never its states; plural
        # and singular toasts.
        run: node scripts/test-slides-copy-slides-browser.mjs
      - name: Clicking a slide never moves the list under the pointer in Chromium
        # With the current slide scrolled out of view, a click on a visible
        # thumb (plain, hidden, parent, state) leaves the list and the thumb
        # where they were; keyboard navigation still reveals the current slide.
        run: node scripts/test-slides-sidebar-click-browser.mjs
      - name: Rounded tables in Chromium
        # A rounded table whose rows outgrow its box shows its last row (#494),
        # keeps rounded corners on its real bottom, and a short one still
        # fills its box; tables without a radius are unchanged.
        run: node scripts/test-slides-table-radius-browser.mjs
      - name: Paste position in Chromium
        # ⌘C then ⌘V onto another slide keeps the element's position; onto the
        # source slide it steps +20 and cascades (#569).
        run: node scripts/test-slides-paste-position-browser.mjs
      - name: Save queue in Chromium
        # Real ⌘S and auto-save with the file write held open: an edit made
        # during a write stays dirty, writes never overlap, the dot goes out
        # only when the deck on screen is the one on disk.
        run: node scripts/test-slides-save-browser.mjs
      - name: Recovery-off notice in Chromium
        # Under a per-document store host that refuses the recovery copy, the
        # save status says crash recovery is off (approved wording), once, held
        # long enough to read; the dot stops claiming a backup; a host that
        # keeps the copy gets no message; never for an encrypted deck.
        run: node scripts/test-slides-recovery-off-browser.mjs
      - name: Save a copy and the older-snapshot banner in Chromium
        # "Save a copy…" says "Copy saved — you are still editing the original",
        # keeps the chip, title and dot on the original, and the next ⌘S writes
        # the original with no picker; an older recovery snapshot gets the
        # warning banner (Keep the file is the default and deletes nothing), a
        # newer one the plain banner that claims nothing.
        run: node scripts/test-slides-save-copy-browser.mjs
      - name: Ghost Cut in Chromium
        # ⇧⌘X fades the selection by CSS (shadowed elements too) and copies it;
        # a ghost is never selected and the pointer passes through it; Esc
        # restores; paste moves it to the pointer in one undo step, across
        # slides, without two elements sharing an id on one slide.
        run: node scripts/test-slides-ghost-cut-browser.mjs
      - name: Bullet indent in Chromium
        # Tab / Shift+Tab nest and un-nest list items (and typed bullets) while
        # editing, with the caret kept and ⌘Z right after; the panel's Indent /
        # Outdent do the same; committed, one undo step; Tab outside a list —
        # a plain box, a table cell — is unchanged.
        run: node scripts/test-slides-bullet-indent-browser.mjs
      - name: Leaving an inline code run in Chromium
        # A text box that already ends a line in `code` (reopened, pasted):
        # typing at the end of that line is plain text, at the box's end or
        # before a line break; opening and closing a box changes nothing.
        run: node scripts/test-slides-code-run-exit-browser.mjs
      - name: The code typewriter types in the show and nowhere else in Chromium
        # Stable token ids (a plain→typewriter morph types only the new text),
        # no cursor in the editor, a capped run, and M or leaving the slide
        # settles it at once.
        run: node scripts/test-slides-typewriter-browser.mjs
      - name: Connectors route on every slide in Chromium
        # #493: a deck saved or loaded with stale connector endpoints opens with
        # every slide's connectors on their elements' borders (thumbnail too),
        # without dirtying the deck or making an undo step.
        run: node scripts/test-slides-connectors-browser.mjs
      - name: Caret at the start of a line in Chromium
        # #547: with the caret at a text box's left edge, nothing paints over
        # it — the editing ring is an outline held off the box, Moveable's
        # leftover lines are hidden for the edit, and a screenshot of the strip
        # beside the caret has no ring-blue in it; the text does not move.
        run: node scripts/test-slides-caret-ring-browser.mjs
      - name: Shift-click inside a selection in Chromium
        # A Shift-click inside a multi-selection's box adds or removes the
        # element under the pointer (the box used to swallow it), touch too.
        run: node scripts/test-slides-shift-select-browser.mjs
      - name: Reaching the element under the pointer in Chromium
        # ⌘-click selects exactly, inside a group; Alt-click digs, also through
        # a handle on a small label; a 1–3px wobble is a click, not a duplicate;
        # the right-click menu lists every element under the pointer.
        run: node scripts/test-slides-pick-layer-browser.mjs
      - name: Alt-hover measures in Chromium
        # Distances from the selection to the element under the pointer, at two
        # zooms; inspection only — no doc change, no undo step; clears cleanly.
        run: node scripts/test-slides-measure-browser.mjs
      - name: Layer groups and names in Chromium
        # Group rows, fold, select; inside a group a click picks a member; rows
        # and groups rename in place without stealing focus or losing typing.
        run: node scripts/test-slides-layer-groups-browser.mjs
      - name: Inspector tabs in Chromium
        # Format | Animate | Interact: every control has one home; Layers lives
        # in the side column; tabs and side view hold across reloads.
        run: node scripts/test-slides-inspector-tabs-browser.mjs
      - name: Inspector fits its column in Chromium
        # In en, pt and de across the showcase: nothing past the panel's edge,
        # no cut dropdown values, the toolbar, colour fields, theme colours and
        # page-size tiles behave.
        run: node scripts/test-slides-inspector-look-browser.mjs
      - name: Inspector copy in Chromium
        # No stored model value shows as a label; retired wording stays gone.
        run: node scripts/test-slides-copy-browser.mjs
      - name: Segmented controls in Chromium
        run: node scripts/test-slides-segmented-browser.mjs
      - name: Scrubbing numeric fields in Chromium
        # Drag a label to change a value: live, one undo step, ×10 with Shift,
        # never past the field's limits, no dead zone after one.
        run: node scripts/test-slides-scrub-browser.mjs
      - name: Every numeric field scrubs in Chromium
        run: node scripts/test-slides-scrub-coverage-browser.mjs
      - name: Hints in Chromium
        # One tooltip for the chrome: on pointer only, title handed back,
        # shortcut chips; section help folded behind a '?'.
        run: node scripts/test-slides-hints-browser.mjs
      - name: Speaker notes pane in Chromium
        # Under the canvas, following the slide, one undo per burst; meets both
        # side panels; resized from its top edge; folds.
        run: node scripts/test-slides-notes-pane-browser.mjs
      - name: Shortcuts sheet fits in Chromium
        # No key overlaps a description, in en, pt and de, at two widths.
        run: node scripts/test-slides-help-sheet-browser.mjs
      - name: Laser fades when released in Chromium
        run: node scripts/test-slides-laser-release-browser.mjs
      - name: Auto-layout frames in Chromium
        # ⇧A wraps the selection in a frame in one undo step; moving the frame
        # moves its children; the inspector gap re-lays them; padding and gap
        # bands on canvas; children under the frame in Layers; clip; delete
        # unparents; undo restores the slide exactly.
        run: node scripts/test-slides-frames-browser.mjs
      - name: Components and design tokens in Chromium
        # ⌥⌘K makes a main; Insert drops a copy that follows it, keeps its own
        # offset and its overrides; Detach stops it. A number token binds from
        # the field's dot, follows edits and mode switches, detaches from its pill.
        run: node scripts/test-slides-components-browser.mjs
      - name: Command palette in Chromium
        # ⌘K opens, filters, runs, closes; the keys that moved into the command
        # list still work, and not while typing in a field.
        run: node scripts/test-slides-command-palette-browser.mjs
      - name: Canvas feedback in Chromium
        # The modifier line, the transform pill, morph pairing (badge, ghost,
        # preview) and Layers' padlock and eye.
        run: node scripts/test-slides-hud-browser.mjs
      - name: Editor-UI review fixes in Chromium
        # Keys a control owns never reach the editor (a gradient stop's
        # Backspace), Mixed fields step and multiply per element, tools stay
        # out of open sheets and read-only, the palette respects IME and
        # returns focus, and the HUD is built once per language switch.
        run: node scripts/test-slides-ui-fixes-browser.mjs
      - name: Empty inspector sections fold nothing in Chromium
        # A section that is only its header reads as open and is no button.
        run: node scripts/test-slides-empty-fold-browser.mjs
      - name: Chrome polish in Chromium
        # Where dragged slides land, tabs in narrow sidebars, hints in the
        # speaker view, and one home for the deck's colours.
        run: node scripts/test-slides-chrome-polish-browser.mjs
      - name: Chrome that holds still in Chromium
        # Layer rows never move under the pointer; panel handles are centred SVG chevrons.
        run: node scripts/test-slides-steady-chrome-browser.mjs
      - name: Drag into a frame in Chromium
        # Layers and canvas drops put elements inside auto-layout frames, at a slot.
        run: node scripts/test-slides-frame-drop-browser.mjs
      - name: One pressed tool, and Select only in Chromium
        # V is pressed at rest; an armed tool presses itself; S selects by
        # dragging from anywhere and never moves anything.
        run: node scripts/test-slides-select-tool-browser.mjs
      - name: Polish pass 3 in Chromium
        # Reorder inside a frame (bar, slot, arrows, out), ⇧A's gap floor,
        # frame-placed note, toast placement, ⌘A, Enter hands keys back, no cut
        # segments or wrapped captions (en/de/pt), names that tell levels apart.
        run: node scripts/test-slides-polish3-browser.mjs
      - name: UX audit canvas fixes in Chromium
        # A press on an unselected element drags it; a key typed at a selected
        # text box is text; a frame copies, duplicates and deletes with its
        # contents; Figma's selection model (outermost first, double-click in,
        # Esc out); the box tools draw; Layers rows read apart; the narrow
        # topbar folds instead of overlapping; toasts clear the notes pane.
        run: node scripts/test-slides-ux-canvas-browser.mjs
      - name: Keeping a deck on-brand in Chromium
        # The UX audit's tokens and components findings: token names stay
        # readable, tokens and components are findable from ⌘K and ?, uses walk,
        # a mode switch says what it changed, theme colours are built-in tokens,
        # a literal colour can become a token for every use, and a component
        # copy reaches its main.
        run: node scripts/test-slides-ux-brand-browser.mjs
      - name: Inspector craft in Chromium
        # Icon pickers where the options are visual, one two-column grid, the
        # padlock inside W, captions that fit in en/de/pt, side tabs that never
        # cut a word in any core locale, and a dark field edge at 3:1.
        run: node scripts/test-slides-ux-craft-browser.mjs
      - name: UX audit inspector behaviour in Chromium
        # The arrange toolbars never cover or drop a tool (1/2/3 selected, en/de/pt),
        # align/distribute keys, shared Fill/Stroke/Shadow on a multi-selection,
        # a frame child's placement, number fields that explain a refusal and
        # hand ⌘Z/Esc back, one Solid|Linear|Radial, layer rows that fit, and
        # focus that survives the panel's rebuilds.
        run: node scripts/test-slides-ux-inspector-browser.mjs
      - name: Vector booleans in Chromium
        # The contextual bar for 2+ closed shapes; Subtract makes one path in the
        # bottom slot with a real hole; one undo; the op switch; Release after a
        # move; ⌥⇧I; Flatten; `bool` survives a reload.
        run: node scripts/test-slides-booleans-browser.mjs
      - name: Numeric fields take arithmetic; Mixed values in Chromium
        # 360/2 and +24 in a field, ↑/↓ stepping, the locked scrub (or its
        # fallback), and a multi-selection's Mixed X moved by one delta each.
        run: node scripts/test-slides-inspector-scrub-browser.mjs
      - name: Colour popover in Chromium
        # Opens from the swatch instead of the native picker; live preview,
        # one undo step, typed hex/RGB/names, theme swatch links, Esc cancels.
        run: node scripts/test-slides-color-popover-browser.mjs
      - name: Insert tools and path bar in Chromium
        # V F R O L P T on the canvas, their badges and tooltips from the command
        # list; the path bar's Corner / Smooth / Symmetric and Close path; data-cmd
        # on the chrome and the element menu; the ? sheet's Tools section.
        run: node scripts/test-slides-insert-tools-browser.mjs
      - name: Inspector Export section in Chromium
        # PNG 1×/2× and SVG of the slide or the selection's box (rotation
        # included), and Copy as JSON = ⌘C's payload.
        run: node scripts/test-slides-export-section-browser.mjs
      - name: Paint in Chromium
        # Radial/per-corner/outside-stroke/flip render; Solid | Linear | Radial,
        # the stop bar, the popover's kinds, the canvas gradient knob, stroke
        # position, dashes, corners, flip; hover previews write nothing.
        run: node scripts/test-slides-paint-browser.mjs
      - name: Fill and stroke stacks in Chromium
        # Visible layers drawn bottom first, fills under strokes; add a fill or
        # stroke layer; eye, move and remove are one undo step each; one layer
        # left folds back into the plain keys.
        run: node scripts/test-slides-stacks-browser.mjs
      - name: Inspector finish in Chromium
        # OKLCH in the colour popover (in-gamut exact, out-of-gamut flagged);
        # font / shadow / opacity tokens bound and followed; the W·H padlock
        # carries the other side, one undo; Export's contrast grade and alt
        # text; the morph link toggle; popovers still under reduced motion.
        run: node scripts/test-slides-finish-browser.mjs
      - name: Inspector fixes in Chromium
        # Colours keep their opacity through theme links, one undo per colour,
        # a scrub held at a limit is no undo step, pointercancel ends a scrub.
        run: node scripts/test-slides-inspector-fixes-browser.mjs
      - name: Native SVG export in Chromium
        # The Export section's SVG is vectors a design tool opens — no
        # foreignObject, no HTML: shapes, gradients, <text> runs per rendered
        # line, list bullets, an <image>, a shadow filter, turns and mirrors as
        # transforms — and drawn as an <img> it matches the slide's own render
        # to within glyph edges. An element's export frames its shadow.
        run: node scripts/test-slides-svg-export-browser.mjs
      - name: Paint layers and the morph in Chromium
        # Stroke gradients (a flat line too), line stroke stacks with tips on
        # the top layer, fills at the box under an outside stroke, layer
        # blend; mid-morph a frame child stays clipped by the travelling frame
        # and stroke layers tween colour and width; the editor Preview shows
        # the same clip and gradient mix; layer rows blend, dash, drag-reorder
        # and turn a stroke into a gradient.
        run: node scripts/test-slides-morph-render-browser.mjs
      - name: Building a morph in Chromium
        # One truth for "will this morph" (checkbox, badge, ghost, status agree;
        # a Fade slide says so and offers Use Morph), renames carry to partners,
        # the pairing picker names elements, the Preview shows the whole slide,
