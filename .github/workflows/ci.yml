# The required check: `validate`, the quick check, on every PR and every push
# to main. Validate, never release.
#
# It runs `node scripts/check.mjs --affected HEAD^1`: only what the diff
# reaches. On a pull request the checkout is GitHub's merge commit, whose first
# parent is main's tip, so HEAD^1..HEAD is exactly what merging would change;
# on a push to main it is what the merge changed. scripts/check.mjs says how
# it chooses (the CI steps themselves, from .github/, by import distance and
# tier, nearest first, within a time budget) and prints why each step ran and
# what it left to the sweep. The target is about a minute for a typical PR.
#
# Everything it leaves still runs: in the sweep (scripts/sweep.mjs, the full
# tier on one commit, kept by sha; a release refuses without a green one), and
# on GitHub's runners by hand (ci-full.yml and each ci-<zone>.yml, dispatch
# only). A new rig still goes at the END of its zone's slice,
# .github/actions/validate-<zone>/action.yml, never in this file: the check
# reads it from there.
#
# Deliberately absent: signing, publishing, deploying. Releases are cut
# locally so the signing key never leaves the maintainer's machine and the
# signed bytes are the served bytes (docs/RELEASING.md). Keep it that way —
# do not add secrets or release steps to this workflow.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PR branches share one group per ref, so a new push collapses onto the tip.
  # Pushes to main get a group PER COMMIT: GitHub keeps at most one pending run
  # per group, so a shared group cancels queued merge commits instead of
  # lining them up (docs/DECISIONS.md).
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # THE REQUIRED CHECK. Branch protection requires a check named `validate`.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the merge commit and its first parent: the diff the check plans from
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          # ≥23.6 required: rigs run TypeScript via native type stripping.
          node-version: 24

      - name: Restore the apps' node_modules
        # Keyed exactly by the lockfiles (no fallback: a stale node_modules
        # would pass a check against the wrong dependencies).
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            slides/node_modules
            spaces/node_modules
            dash/node_modules
            type/node_modules
          key: deps-${{ runner.os }}-node24-${{ hashFiles('slides/package-lock.json', 'spaces/package-lock.json', 'dash/package-lock.json', 'type/package-lock.json') }}

      - name: Install the apps' node_modules (only when the lockfiles changed)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # (each install's own status: a bare `wait` returns 0 whatever failed)
          pids=()
          for app in slides spaces dash type; do npm ci --prefix "$app" --no-audit --no-fund & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done

      - name: Restore the pinned browser
        # Playwright and its Chromium, installed by the check only when a step
        # it runs drives a browser; keyed by the file that pins the version.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/bento-browser
          key: browser-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-full.yml') }}

      - name: Restore the check's result cache
        # Content-keyed passes (scripts/lib/check-cache.mjs) and built shells:
        # a rerun skips what did not change. Saved under a new key every run;
        # restored from the newest of this branch or main. (actions/cache
        # refuses a path with `..` in it, and then silently saves nothing.)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bento-check-cache
          key: check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            check-${{ runner.os }}-

      - name: Quick check
        env:
          BENTO_CHECK_CACHE: ${{ runner.temp }}/bento-check-cache
          BENTO_BROWSER_DIR: ${{ runner.temp }}/bento-browser
        run: node scripts/check.mjs --affected HEAD^1 --logs "$RUNNER_TEMP/check-logs"
