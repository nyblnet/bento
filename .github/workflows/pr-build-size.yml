name: PR build size

on:
  # By hand only (2026-11-28): four builds of each side are well over the
  # quick check's minute, so this no longer runs on every PR push. Dispatch it
  # for a PR whose size matters; the table lands in the run's summary:
  #   gh workflow run pr-build-size.yml -f pr=<n> -f base_sha=<sha> -f head_sha=<sha>
  # (pr-build-size-comment.yml comments only after a pull_request run, so a
  # dispatched run does not comment.)
  workflow_dispatch:
    inputs:
      pr:
        description: the pull request number (for the report)
        required: true
      base_sha:
        description: the base commit
        required: true
      head_sha:
        description: the head commit
        required: true
      head_repo:
        description: the head repository (owner/name), when not this one
        required: false
        default: ''

permissions:
  contents: read

jobs:
  measure:
    concurrency:
      group: pr-build-size-${{ inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build base bento/slides
        working-directory: base/slides
        run: |
          npm ci
          npm run build:single

      - name: Build base bento/spaces
        working-directory: base/spaces
        run: |
          npm ci
          npm run build:single

      - name: Build base bento/dash
        working-directory: base/dash
        run: |
          npm ci
          npm run build:single

      - name: Record base sizes
        env:
          BASE_ROOT: ${{ github.workspace }}/base
          OUTPUT_PATH: ${{ runner.temp }}/bento-base-sizes.json
        run: |
          node --input-type=module <<'NODE'
          import { statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const files = {
            'bento/slides': 'slides/dist-single/Bento_Slides.bento.html',
            'bento/spaces': 'spaces/dist-single/Bento_Spaces.bento.html',
            'bento/dash': 'dash/dist-single/Bento_Dash.bento.html',
          };
          const sizes = Object.fromEntries(
            Object.entries(files).map(([app, file]) => [
              app,
              statSync(join(process.env.BASE_ROOT, file)).size,
            ]),
          );
          writeFileSync(process.env.OUTPUT_PATH, JSON.stringify(sizes), { mode: 0o600 });
          NODE

      - name: Remove base checkout
        run: rm -rf -- "$GITHUB_WORKSPACE/base"

      - name: Check out PR head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha }}
          path: head
          persist-credentials: false

      - name: Build PR bento/slides
        working-directory: head/slides
        run: |
          npm ci
          npm run build:single

      - name: Build PR bento/spaces
        working-directory: head/spaces
        run: |
          npm ci
          npm run build:single

      - name: Build PR bento/dash
        working-directory: head/dash
        run: |
          npm ci
          npm run build:single

      - name: Create report
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          BASE_SIZES_PATH: ${{ runner.temp }}/bento-base-sizes.json
          HEAD_ROOT: ${{ github.workspace }}/head
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr }}
          REPORT_DIRECTORY: ${{ runner.temp }}/bento-pr-build-size
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const files = {
            'bento/slides': 'slides/dist-single/Bento_Slides.bento.html',
            'bento/spaces': 'spaces/dist-single/Bento_Spaces.bento.html',
            'bento/dash': 'dash/dist-single/Bento_Dash.bento.html',
          };
          const baseSizes = JSON.parse(readFileSync(process.env.BASE_SIZES_PATH, 'utf8'));
          const report = {
            schemaVersion: 1,
            pullRequest: Number(process.env.PR_NUMBER),
            baseSha: process.env.BASE_SHA,
            headSha: process.env.HEAD_SHA,
            apps: Object.entries(files).map(([app, file]) => ({
              app,
              baseBytes: baseSizes[app],
              headBytes: statSync(join(process.env.HEAD_ROOT, file)).size,
            })),
          };
          mkdirSync(process.env.REPORT_DIRECTORY, { recursive: true });
          writeFileSync(
            join(process.env.REPORT_DIRECTORY, 'report.json'),
            JSON.stringify(report),
            { mode: 0o600 },
          );
          const kb = (n) => `${(n / 1024).toFixed(1)} KB`;
          const rows = report.apps.map((a) => `| ${a.app} | ${kb(a.baseBytes)} | ${kb(a.headBytes)} | ${a.headBytes - a.baseBytes >= 0 ? '+' : ''}${a.headBytes - a.baseBytes} B |`);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `| app | base | head | change |\n|---|---|---|---|\n${rows.join('\n')}\n`);
          NODE

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bento-pr-build-size
          path: ${{ runner.temp }}/bento-pr-build-size/report.json
          if-no-files-found: error
          retention-days: 1
