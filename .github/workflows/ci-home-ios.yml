# CI, home-ios: this zone's own jobs — validate, never release (see ci.yml's header).
#
# These jobs are NOT the required check. Only `validate` (ci.yml) gates a
# merge; a job here reports beside it, exactly as it did when it lived in
# ci.yml. Keep each job's id unchanged — the id IS the check name.
#
# Each job checks out and builds what it needs for itself. Add this zone's
# new jobs here, at the end; never in ci.yml.

name: CI (home-ios)

on:
  pull_request:
    # No paths filter here: a filter would also stop the `full-ci` label from
    # starting these jobs. The gate job below decides instead, in seconds.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  # The same rule as ci.yml, whose comment explains it: PR runs collapse onto
  # the tip, every commit on main keeps its own run.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  home-ios-gate:
    # These jobs are heavy and none is the required check. On a PR they run
    # only if it changes this zone's own files or carries the `full-ci` label;
    # on main they always run. See scripts/ci/zone-gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            scripts/lib/ci-skips.mjs
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: scripts/ci/zone-gate '^(home/ios/|home/fixtures/|\.github/workflows/ci-home-ios\.yml$|scripts/ci/zone-gate$)'

  home-ios-swift:
    needs: home-ios-gate
    if: needs.home-ios-gate.outputs.run == 'true'
    # The home/ios Swift rigs need CryptoKit, Security and LocalAuthentication,
    # so on the ubuntu validate job they print SKIPPED and pass. Here they run
    # for real, and a rig that reports SKIPPED FAILS the step, so a missing
    # toolchain can never pass quietly.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain
        run: sw_vers && xcrun swiftc --version
      - name: Swift rigs (a skip fails)
        shell: bash
        run: |
          set -o pipefail
          rigs=(
            test-tray-releases.mjs
            test-home-origin.mjs
            test-home-docstore-ios.mjs
            test-home-id-keys.mjs
            test-home-id-statements.mjs
            test-home-id-agent.mjs
            test-home-id-recovery.mjs
            test-home-id-bridge.mjs
            test-home-spotlight.mjs
            test-home-gate1.mjs
            test-home-release-history.mjs
            test-home-web-out.mjs
          )
          for rig in "${rigs[@]}"; do
            echo "::group::$rig"
            node "scripts/$rig" | tee "$RUNNER_TEMP/rig.out"
            echo "::endgroup::"
            if grep -q 'SKIPPED' "$RUNNER_TEMP/rig.out"; then echo "::error::$rig skipped on macOS"; exit 1; fi
          done

  home-ios-simulator:
    needs: home-ios-gate
    if: needs.home-ios-gate.outputs.run == 'true'
    # Builds the iOS app and drives it on a simulator: the app-switcher snapshot
    # iOS writes to disk shows nothing of a sealed document. The rig reads back
    # the snapshots iOS itself wrote; a skip fails here too.
    runs-on: macos-latest
    # 40, not 30: the snapshot rig may background each case up to three times
    # (a minute's wait each) before it fails as "iOS wrote no snapshot".
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain
        run: |
          brew install xcodegen
          sw_vers && xcodebuild -version && xcrun simctl list runtimes
      - name: Snapshot cover (a skip fails)
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-home-snapshot-cover.mjs | tee "$RUNNER_TEMP/rig.out"
          if grep -q 'SKIPPED' "$RUNNER_TEMP/rig.out"; then echo "::error::snapshot cover skipped on macOS"; exit 1; fi
      - name: Gate 1 in the app (a skip fails)
        # The editor serves a genuine document under its release's pinned CSP,
        # and an unknown one as before; read back on a simulator, attack rows included.
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-home-gate1-host.mjs | tee "$RUNNER_TEMP/rig.out"
          if grep -q 'SKIPPED' "$RUNNER_TEMP/rig.out"; then echo "::error::gate 1 host skipped on macOS"; exit 1; fi
      - name: Stage 0 device probes (a skip fails)
        # The DEBUG-only sign-session probe is in the Debug app and absent from
        # the Release app (with a positive control); the passkey origin probe is
        # its own project; the app needs no entitlement; the probe runs on a simulator.
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-home-stage0-probes.mjs | tee "$RUNNER_TEMP/rig.out"
          if grep -q 'SKIPPED' "$RUNNER_TEMP/rig.out"; then echo "::error::stage 0 probes skipped on macOS"; exit 1; fi
