# CI, type: this zone's own jobs — validate, never release (see ci.yml's header).
#
# These jobs are NOT the required check. Only `validate` (ci.yml) gates a
# merge; a job here reports beside it, exactly as it did when it lived in
# ci.yml. Keep each job's id unchanged — the id IS the check name.
#
# Each job checks out and builds what it needs for itself. Add this zone's
# new jobs here, at the end; never in ci.yml.

name: CI (type)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # The same rule as ci.yml, whose comment explains it: PR runs collapse onto
  # the tip, every commit on main keeps its own run.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Every step fails if a rig in it reports a skip CI does not allow
    # (scripts/lib/ci-skips.mjs). No job here sets a working-directory, which
    # this relative path relies on.
    shell: bash scripts/ci/bento-step {0}

jobs:
  type-boot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: Type boots on the loader's inline path; fields wiring still works
        run: node scripts/test-type-boot-browser.mjs
      - name: Release pins in Chromium
        # bento/connect K4 (security §18/§36): this build's pins come from its
        # own bytes, a real file its ⌘S saved, and it boots under them while its
        # UI is driven, with only the loader's two designed refusals. What
        # release.mjs requires before it signs, checked on every PR.
        run: node scripts/derive-pins.mjs type/dist-single/Bento_Type.bento.html

  type-find-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: Find opens from the button, Cmd-F and Ctrl-F
        # The find box lives in Navigate → Results; a selector naming a tab
        # that no longer existed made both do nothing, silently.
        run: node scripts/test-type-find-browser.mjs

  type-cantopen-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: The can't-open message shows the file's details as text
        run: node scripts/test-type-cantopen-browser.mjs

  type-fields-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: Every chrome field wears the suite's one field look, light and dark
        # The THE FIELD block copied from slides: border, fill, radius, height and
        # the focus ring, measured on twelve real surfaces, plus a planted
        # browser-default field that must be flagged.
        run: node scripts/test-type-fields-browser.mjs

  type-sealed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the sealed TEST shell
        run: |
          npm ci --prefix type
          npm run build:sealtest --prefix type
      - name: A sealed document leaves no plaintext and shows a neutral title
        run: node scripts/test-type-sealed-browser.mjs

  type-printframe-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: The print frame is inert and runs under the identity CSP; saved previews stay inert
        # bento/connect gate-1 invariant 3's one exception (R-t): the builder
        # emits inert markup, the frame inherits the hash-only CSP and carries
        # its own script-src 'none', and the real shell prints under the CSP.
        run: node scripts/test-type-printframe-browser.mjs

  type-sinks-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix type
          npm run build:single --prefix type
      - name: Embed pictures and footnote ids never become script in the editor or print
        run: node scripts/test-type-sinks-browser.mjs
