# SCRATCH: why test-shell-loader's hidden splash measures 60-85 ms in the quick check. Never merged.
name: scratch loader timing
on:
  pull_request:
    paths: ['.github/workflows/scratch-loader.yml']
jobs:
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --prefix slides --no-audit --no-fund && npm run build:single --prefix slides
      - name: A. directly, nothing else installed
        run: for i in 1 2 3; do node scripts/test-shell-loader.ts | grep -E 'splash is gone within 50|mounted BEFORE'; done
      - name: B. through check.mjs, alone
        run: for i in 1 2; do node scripts/check.mjs --only test-shell-loader.ts --no-cache 2>&1 | grep -E 'splash is gone|test-shell-loader|^ok:|^FAIL:'; done
      - name: C. after playwright install --with-deps chromium (as the old job did)
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          for i in 1 2 3; do node scripts/test-shell-loader.ts | grep -E 'splash is gone within 50|mounted BEFORE'; done
