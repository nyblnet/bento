# XcodeGen spec — `brew install xcodegen && cd home/ios && xcodegen` produces
# BentoTray.xcodeproj. The project file is generated, never committed, so it
# can't rot into a merge-conflict magnet the way .pbxproj does.
name: BentoTray
options:
  bundleIdPrefix: page.bento
  deploymentTarget:
    iOS: "16.0"   # WKURLSchemeHandler + modern UIDocumentBrowser behaviour
targets:
  BentoTray:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: [project.yml]
      # The File System Access polyfill is SHARED with home/android — one copy
      # of the semantics that once wrote documents out as zero bytes. It lands
      # flat in the bundle, so `Bundle.main.url(forResource: "bridge",
      # withExtension: "js")` finds it exactly as it did under Resources/.
      - path: ../bridge.js
        buildPhase: resources
    # NO starter shell is staged into the bundle. It used to be, and it was the
    # single largest thing in the app — the same seed measured 81% of the Android
    # release APK. New documents come from the signed release channel instead
    # (home/ios/Releases.swift), which also means one created here is the version
    # everyone else has rather than whatever was current on build day. There are
    # three apps now and more coming; bundling meant picking one or shipping
    # several copies of Bento inside the app.
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: page.bento.home
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        SWIFT_VERSION: "5.0"
        # Signing. The SIMULATOR needs none of this — it signs ad-hoc, which is
        # why every build so far has just worked. A real device needs a team.
        #
        # The team comes from the ENVIRONMENT at generation time, never from
        # this file: a Team ID identifies a person or company, and the .xcodeproj
        # that carries it is generated and gitignored, so nothing personal is
        # committed. Unset, it expands to empty and simulator builds are
        # unaffected.
        #
        #   BENTO_TEAM_ID=ABCDE12345 xcodegen     # then build to a device
        #
        # Find the ID in Xcode > Settings > Accounts (or developer.apple.com >
        # Membership). A free Apple ID signs for your own devices on a 7-day
        # profile; TestFlight and the App Store need the paid programme.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${BENTO_TEAM_ID}
        # Assets.xcassets is picked up by the source glob above; this names the
        # icon set inside it. Without it the catalog still compiles and the app
        # still ships — with no icon at all, silently.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
