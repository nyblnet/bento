<!doctype html>
<meta charset="utf-8">
<title>bento/home</title>
<link rel="icon" href="../icons/icon.svg">
<link rel="stylesheet" href="ui.css">
<!-- Blocking, and before the body: stamps the theme so the FIRST paint is right. -->
<script src="theme.js"></script>
<style>
  /* "Save a copy…" and exports (saveas.js): a name, and where — beside the
   * document in one click, or a folder chosen in a picker that opens near it. */
  body { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh;
    box-sizing: border-box }
  h1 { font-size: 16px; margin: 0; line-height: 1.3 }
  .file { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px;
    background: var(--hover); min-width: 0 }
  .file b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .file small { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: ltr; unicode-bidi: isolate; text-align: start }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim) }
  input { font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); direction: ltr; unicode-bidi: isolate }
  .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: auto; flex-wrap: wrap }
  .actions .cancel { margin-inline-end: auto }
  .status { font-size: 12px; color: var(--dim); margin: 0; min-height: 1.2em }
</style>
<h1 id="title"></h1>
<div class="file"><b id="name"></b><small id="path"></small></div>
<label><span data-i18n="saName"></span><input id="file" spellcheck="false" autocomplete="off"></label>
<p class="status" id="status" role="status"></p>
<div class="actions">
  <button class="btn link cancel" id="cancel" data-i18n="saCancel"></button>
  <button class="btn" id="choose" data-i18n="saChoose"></button>
  <button class="btn primary" id="beside" hidden></button>
</div>
<script type="module" src="saveas-window.js"></script>
