<!doctype html>
<meta charset="utf-8">
<title>bento/home</title>
<link rel="icon" href="../icons/icon.svg">
<link rel="stylesheet" href="ui.css">
<!-- Blocking, and before the body: stamps the theme so the FIRST paint is right. -->
<script src="theme.js"></script>
<style>
  /* The per-document assistant prompt (background.js askConsent). One
   * question, two answers, and the facts the answer needs: which file, which
   * host, which model. Small on purpose — it is a popup window. */
  body { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh;
    box-sizing: border-box }
  h1 { font-size: 16px; margin: 0; line-height: 1.3 }
  .file { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px;
    background: var(--hover); min-width: 0 }
  .file b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .file small { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: ltr; unicode-bidi: isolate; text-align: start }
  .lead { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.45 }
  .lead code { direction: ltr; unicode-bidi: isolate }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto }
  .remember { font-size: 12px; color: var(--dim); margin: 0 }
</style>
<h1 data-i18n="consentTitle"></h1>
<div class="file"><b id="name"></b><small id="path"></small></div>
<p class="lead" id="lead"></p>
<p class="remember" data-i18n="consentRemember"></p>
<div class="actions">
  <button class="btn" id="deny" data-i18n="consentDeny"></button>
  <button class="btn primary" id="allow" data-i18n="consentAllow"></button>
</div>
<script type="module" src="consent.js"></script>
