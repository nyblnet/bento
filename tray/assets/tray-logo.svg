<!--
  bento/tray mark.

  The mark inverts the parent rather than adding anything to it: the TRAY is the
  surface, filling the frame, and the Bento compartments sit on it. That changes
  the silhouette from dark to light so the sub-brand is its own thing at a
  glance, while the compartment block keeps the parent's exact rhythm — left 7,
  gap 2, right 13; rows 10, gap 2, 10 — so it is unmistakably the same family.

  The third compartment is navy because cream-on-cream would vanish; it borrows
  the frame's colour rather than introducing a fifth.

  Earlier attempts bolted a tray UNDER the mark — a U-shaped cradle, a plinth, a
  lid peeking out behind. All of them fought the format: a tray is wide and flat
  and the frame is square, so anything added below reads as bolted on, and the
  reveal is too narrow to say "surface". Making the tray the ground solves it
  with one shape instead of two.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 32 32"
     role="img" aria-label="Bento Tray">
  <rect width="32" height="32" rx="7" fill="#16273E"/>
  <rect x="3.6" y="3.6" width="24.8" height="24.8" rx="5" fill="#F0EBE0"/>
  <rect x="6.400" y="6.400" width="6.109" height="19.200" rx="2.182" fill="#5E7699"/>
  <rect x="14.255" y="6.400" width="11.345" height="8.727" rx="2.182" fill="#FF9E8A"/>
  <rect x="14.255" y="16.873" width="11.345" height="8.727" rx="2.182" fill="#16273E"/>
</svg>
