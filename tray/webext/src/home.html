<!doctype html>
<meta charset="utf-8">
<title>Bento Tray</title>
<style>
  /* Light and dark are both first-class: this is a full page someone may leave
     open beside their documents, and a white sheet at night is a reason to
     close it. Tokens only — no colour is written twice. */
  :root {
    --bg: #f6f8fa;      --panel: #fff;      --ink: #17222f;   --dim: #6b7a8d;
    --line: #e4e9ef;    --hover: #eef2f6;   --accent: #16273e; --peach: #ff9e8a;
    --good: #2e9e5b;    --bad: #c2453b;     --warn: #c9a227;
    --shadow: 0 1px 2px rgba(20,35,60,.06), 0 8px 24px rgba(20,35,60,.06);
    --lift: 0 2px 6px rgba(20,35,60,.10), 0 14px 34px rgba(20,35,60,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;    --panel: #16202b;   --ink: #e7edf4;   --dim: #90a1b4;
      --line: #24313f;  --hover: #1d2937;   --accent: #e7edf4; --peach: #ff9e8a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
      --lift: 0 2px 6px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.46);
    }
  }

  * { box-sizing: border-box }
  html, body { height: 100% }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 232px 1fr; }

  /* ---------------------------------------------------------------- sidebar */
  aside { border-right: 1px solid var(--line); padding: 18px 12px; display: flex;
    flex-direction: column; gap: 4px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 14px; }
  .brand img { width: 24px; height: 24px; border-radius: 6px }
  .brand b { font-size: 15px; letter-spacing: -.01em }
  .brand b i { color: var(--peach); font-style: normal }

  .navitem { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 9px; border: 0; border-radius: 8px; background: none; color: inherit;
    font: inherit; cursor: pointer; }
  .navitem:hover { background: var(--hover) }
  .navitem[aria-current="true"] { background: var(--hover); font-weight: 600 }
  .navitem .n { margin-left: auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums }
  .navitem .swatch { width: 8px; height: 8px; border-radius: 3px; background: var(--dim); flex: none }
  .navitem.warnrow .swatch { background: var(--bad) }
  .seclabel { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    padding: 14px 9px 5px }
  aside .spacer { flex: 1 }
  .ghost { border: 1px dashed var(--line); border-radius: 8px; padding: 7px 9px; color: var(--dim);
    background: none; font: inherit; cursor: pointer; text-align: left }
  .ghost:hover { background: var(--hover); color: var(--ink) }

  /* ------------------------------------------------------------------- main */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh }
  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 22px 12px }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.015em; flex: none }
  .search { flex: 1; max-width: 340px; position: relative }
  .search input { width: 100%; padding: 7px 11px 7px 30px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--panel); color: inherit; font: inherit }
  .search input:focus { outline: 2px solid var(--peach); outline-offset: -1px; border-color: transparent }
  .search .mag { position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 12px; pointer-events: none }
  select, .btn { font: inherit; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--panel); color: inherit; cursor: pointer }
  .btn:hover, select:hover { background: var(--hover) }
  .btn.primary { background: var(--accent); border-color: var(--accent);
    color: color-mix(in srgb, var(--panel) 92%, white) }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0f1720 } }
  .btn.primary:hover { filter: brightness(1.12) }
  .grow { flex: 1 }

  .notice { margin: 0 22px 10px; padding: 10px 13px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--line); color: var(--dim); font-size: 13px; box-shadow: var(--shadow) }
  .notice b { color: var(--ink) }
  .notice.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)) }

  /* ------------------------------------------------------------------ grid */
  .grid { flex: 1; overflow-y: auto; padding: 6px 22px 28px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 16px;
    align-content: start }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    overflow: hidden; box-shadow: var(--shadow); cursor: pointer; text-align: left; padding: 0;
    color: inherit; font: inherit; display: flex; flex-direction: column;
    transition: transform .13s ease, box-shadow .13s ease }
  .card:hover { transform: translateY(-2px); box-shadow: var(--lift) }
  .card:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px }
  /* An unopenable card must not read as a BROKEN card. Dimming the whole thing
     made the title unreadable and put it in the same visual bucket as a
     document that simply has no thumbnail yet — which is a perfectly healthy
     document. So the text stays full strength and only the picture area is
     marked, with a dashed edge that reads as "waiting" rather than "faulty". */
  .card[disabled] { cursor: default }
  .card[disabled]:hover { transform: none; box-shadow: var(--shadow) }
  .card.unplaced .shot { border: 1px dashed var(--line); border-bottom-width: 1px;
    background: repeating-linear-gradient(45deg, transparent, transparent 7px,
      var(--hover) 7px, var(--hover) 14px) }
  .card.unplaced .cardbody b { opacity: .75 }
  /* "Not saved yet" — said in words, because a bare glyph is indistinguishable
     from a thumbnail that failed to load. */
  .shot .label { position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 12px; letter-spacing: .01em }
  /* Found by content, not by name — so it opens from here but will still ask
     where to save. Quiet, but present: half-support that looks like full
     support is worse than no support. */
  .card { position: relative }
  .card .tag { position: absolute; top: 7px; right: 7px; background: var(--panel);
    border: 1px solid var(--line); color: var(--dim); font-size: 10.5px; line-height: 1;
    padding: 3px 5px; border-radius: 5px; letter-spacing: .02em }
  .shot { aspect-ratio: 16/9; background: var(--hover); position: relative; overflow: hidden;
    border-bottom: 1px solid var(--line) }
  .shot iframe { width: 1280px; height: 720px; border: 0; transform-origin: 0 0; position: absolute;
    left: 0; top: 0; pointer-events: none }
  .shot .glyph { position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 26px }
  .cardbody { padding: 10px 12px 12px; display: flex; gap: 8px; align-items: flex-start }
  .cardbody .txt { min-width: 0; flex: 1 }
  .cardbody b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis }
  .cardbody span { display: block; color: var(--dim); font-size: 12px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis }
  .more { border: 0; background: none; color: var(--dim); cursor: pointer; font: inherit;
    padding: 2px 5px; border-radius: 6px; line-height: 1 }
  .more:hover { background: var(--hover); color: var(--ink) }

  .empty { padding: 40px 22px; color: var(--dim); max-width: 46ch }
  .empty h2 { color: var(--ink); font-size: 16px; margin: 0 0 6px }

  /* ------------------------------------------------------------------ menu */
  .menu { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--lift); padding: 5px; min-width: 176px }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none;
    color: inherit; font: inherit; padding: 6px 9px; border-radius: 7px; cursor: pointer }
  .menu button:hover { background: var(--hover) }
  .menu .sep { height: 1px; background: var(--line); margin: 5px 4px }
  .menu .note { color: var(--dim); font-size: 12px; padding: 4px 9px 6px }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--accent); color: var(--panel); padding: 9px 15px; border-radius: 999px;
    box-shadow: var(--lift); font-size: 13px; z-index: 30 }
  @media (prefers-color-scheme: dark) { .toast { color: #0f1720 } }
</style>

<aside>
  <div class="brand">
    <img src="../icons/icon-48.png" alt="">
    <b>bento<i>/</i>tray</b>
  </div>

  <button class="navitem" id="navAll" aria-current="true">
    <span class="swatch"></span> All documents <span class="n" id="nAll"></span>
  </button>

  <div class="seclabel">Folders</div>
  <div id="folders"></div>

  <button class="ghost" id="addFolder">+ Add a folder…</button>

  <div class="spacer"></div>
  <button class="navitem" id="settings"><span class="swatch"></span> Settings</button>
</aside>

<main>
  <div class="bar">
    <h1 id="heading">All documents</h1>
    <div class="search">
      <span class="mag">⌕</span>
      <input id="q" type="search" placeholder="Search documents   /" autocomplete="off">
    </div>
    <select id="sort" title="Sort">
      <option value="recent">Recently changed</option>
      <option value="name">Name</option>
      <option value="folder">Folder</option>
    </select>
    <span class="grow"></span>
    <button class="btn primary" id="new">+ New document</button>
  </div>

  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</main>

<script type="module" src="home.js"></script>
