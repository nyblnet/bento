<!doctype html>
<meta charset="utf-8">
<title>Bento Tray</title>
<style>
  body { font: 13.5px/1.5 -apple-system, system-ui, sans-serif; color: #1e2a3a; margin: 0; width: 290px; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header img { width: 20px; height: 20px; border-radius: 5px; }
  header b { font-size: 14px; }
  .rows { padding: 0 14px 4px; }
  .row { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid #eceff3; }
  .row:first-child { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
  .ok { background: #2e9e5b } .bad { background: #c2453b } .meh { background: #c9a227 }
  .t { flex: 1 }
  .t b { display: block; font-weight: 600 }
  .t span { color: #6b7a8d; font-size: 12.5px }
  footer { padding: 10px 14px 13px; display: grid; gap: 6px; }
  button { font: inherit; width: 100%; padding: 7px 10px; border: 1px solid #c8d0dc; border-radius: 8px; background: #fff; cursor: pointer; }
  button:hover { background: #f5f7fa }
  button.primary { border-color: #16273e; background: #16273e; color: #fff }
  button.primary:hover { background: #22364f }
  .hint { color: #6b7a8d; font-size: 12px; margin: 2px 0 0 }
  code { background: #eef1f5; padding: 1px 4px; border-radius: 4px; font-size: 12px }
  /* A small picture of Chrome's own dialog. The three options are
     indistinguishable in prose — they are three near-identical pills — so the
     only reliable way to point at the middle one is to draw it. */
  .prime { padding: 2px 14px 0; }
  .prime p { margin: 0 0 7px; color: #6b7a8d; font-size: 12.5px }
  .mock { border: 1px solid #dfe4ea; border-radius: 10px; padding: 9px; background: #fbfcfd }
  .mock .opt { border-radius: 999px; padding: 5px 9px; font-size: 12px; text-align: center;
    background: #f0f2f5; color: #8794a4; margin-bottom: 5px }
  .mock .opt.pick { background: #16273e; color: #fff; font-weight: 600 }
  .mock .opt:last-child { margin-bottom: 0 }
</style>
<header><img src="../icons/icon-48.png" alt=""><b>Bento Tray</b></header>
<div class="rows" id="rows"></div>
<div class="prime" id="prime" hidden>
  <p>Chrome will ask next. Pick the middle one:</p>
  <div class="mock">
    <div class="opt">Allow this time</div>
    <div class="opt pick">Allow on every visit</div>
    <div class="opt">Don’t allow</div>
  </div>
</div>
<footer>
  <button id="renew" class="primary" hidden>Reconnect folders</button>
  <p class="hint" id="hint" hidden><b>Allow this time</b> works, but Chrome asks again every
    time you restart. <b>Don’t allow</b> drops the folder until Chrome offers again.</p>
  <button id="open">Settings…</button>
</footer>
<script type="module" src="popup.js"></script>
