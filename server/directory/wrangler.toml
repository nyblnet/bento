# SPDX-License-Identifier: AGPL-3.0-only
# bento/id directory — id.bento.page (layer 1 of bento/id).
# Deploy is the MAINTAINER's (needs the id.bento.page DNS and the SES account first):
#   npx wrangler secret put DIR_KEY_JWK   # the directory's ONLINE P-256 signing key (JWK, private), for the countersign once it lands — never the release key
#   npx wrangler secret put CHALLENGE_KEY # 32+ random characters: seals the single-use roster challenges
#   npx wrangler deploy
# Local:
#   npx wrangler dev --var DEV:1 --var MAILER:log --var DIR_KID:dev-1 --var DIR_KEY_JWK:"$(cat dev-key.jwk)" --var CHALLENGE_KEY:"$(openssl rand -hex 32)"
name = "bento-id-directory"
main = "src/worker.js"
compatibility_date = "2026-07-01"

routes = [{ pattern = "id.bento.page", custom_domain = true }]

[vars]
DIR_KID = "dir-1"
# The public halves of the current and next directory keys, for /v1/keys
# (diagnosis only: clients trust the list shipped in the signed release).
DIR_PUBKEYS = "[]"
MAILER = "ses"
# Incident records published by hand, [{"id","from","to"}] (ms; "to" null while
# open): a break-glass beside the ones the incident lever stores. Every browser
# check-in and status answer carries both, each signed as the kernel's inc.
# text, and bento/home drops a key made inside one. A list that does not read
# answers 500, and an id published in both places does too.
INCIDENTS = "[]"
# The incident lever's public key (src/lever.js): a raw P-256 point, base64url.
# Its private half is the MAINTAINER's, minted OFFLINE (`node lever.mjs keygen
# --out <path>`), never the release key and never DIR_KEY_JWK. Empty: the lever
# route answers 403 and nothing can pull it. Setting it, and deploying the
# ObIndex migration below, are the maintainer's.
LEVER_PUBKEY = ""

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[durable_objects.bindings]]
name = "ROSTER"
class_name = "Roster"

# The incident lever's day index of ob=1 accounts and its incident records (src/obindex.js)
[[durable_objects.bindings]]
name = "OBINDEX"
class_name = "ObIndex"

# Never deployed, so the migrations were rewritten rather than extended: the
# first design's Address object (typed-code bindings) is gone, and v1 no longer
# creates it. Once anything is deployed, migrations only ever grow.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Roster"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ObIndex"]
